<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="50%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .orbit-cw { transform-origin: 1020px 170px; animation: spinCW 28s linear infinite; }
    .orbit-ccw { transform-origin: 1020px 170px; animation: spinCCW 19s linear infinite; }
    .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
    .pulse-slow { animation: pulse 4s ease-in-out infinite; }
    .scanline { animation: scan 6s linear infinite; }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-340px); } 100% { transform: translateY(340px); } }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="340" rx="18" fill="url(#grid)" />
  <rect width="1200" height="340" rx="18" fill="url(#nebulaCyan)" />
  <rect width="1200" height="340" rx="18" fill="url(#nebulaPurple)" />

  <!-- Animated Vertical Scan Beam -->
  <rect class="scanline" x="0" y="0" width="1200" height="80" fill="url(#scanGrad)" pointer-events="none" />

  <!-- Deep Space Starfield & Constellation Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.16" stroke-width="0.8">
    <line x1="80" y1="55" x2="165" y2="85" />
    <line x1="165" y1="85" x2="230" y2="45" />
    <line x1="640" y1="50" x2="720" y2="90" />
    <line x1="720" y1="90" x2="790" y2="55" />
    <line x1="580" y1="280" x2="670" y2="305" />
  </g>
  <circle class="pulse-dot" cx="80" cy="55" r="2" fill="#00f0ff" />
  <circle cx="165" cy="85" r="1.5" fill="#38bdf8" />
  <circle class="pulse-slow" cx="230" cy="45" r="2.2" fill="#a855f7" />
  <circle cx="640" cy="50" r="1.6" fill="#00f0ff" />
  <circle class="pulse-dot" cx="720" cy="90" r="2" fill="#10b981" />
  <circle cx="790" cy="55" r="1.5" fill="#e2e8f0" />
  <circle class="pulse-slow" cx="520" cy="35" r="1.8" fill="#00f0ff" />
  <circle cx="850" cy="295" r="1.6" fill="#38bdf8" />

  <!-- Corner HUD Brackets -->
  <path d="M 18 42 L 18 18 L 42 18" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 1158 18 L 1182 18 L 1182 42" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 18 298 L 18 322 L 42 322" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 1158 322 L 1182 322 L 1182 298" fill="none" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Right Orbital Telemetry Astrolabe / Radar -->
  <g>
    <circle cx="1020" cy="170" r="118" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle class="orbit-cw" cx="1020" cy="170" r="98" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="18 10 6 10" stroke-opacity="0.55" />
    <circle class="orbit-ccw" cx="1020" cy="170" r="72" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="28 14" stroke-opacity="0.65" />
    <circle cx="1020" cy="170" r="44" fill="#090f1d" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="900" y1="170" x2="1140" y2="170" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1" />
    <line x1="1020" y1="50" x2="1020" y2="290" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1" />

    <!-- Orbiting Satellite Nodes -->
    <g class="orbit-cw">
      <circle cx="1020" cy="72" r="4.5" fill="#00f0ff" filter="url(#glow)" />
      <circle cx="1020" cy="268" r="3.5" fill="#38bdf8" />
    </g>
    <g class="orbit-ccw">
      <circle cx="1092" cy="170" r="4" fill="#a855f7" filter="url(#glow)" />
    </g>

    <!-- Core Callsign Emblem -->
    <text x="1020" y="166" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#00f0ff">SEC // AI</text>
    <text x="1020" y="182" text-anchor="middle" class="mono" font-size="10" fill="#10b981">ONLINE</text>
  </g>

  <!-- Left Command Deck Telemetry Content -->
  <!-- Status Pill -->
  <rect x="48" y="34" width="445" height="28" rx="14" fill="#081121" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
  <circle class="pulse-dot" cx="66" cy="48" r="4.5" fill="#10b981" />
  <text x="80" y="52" class="mono" font-size="11.5" font-weight="600" fill="#10b981">ORBITAL TELEMETRY ONLINE</text>
  <text x="262" y="52" class="mono" font-size="11.5" fill="#64748b">//</text>
  <text x="282" y="52" class="mono" font-size="11.5" fill="#38bdf8">CALLSIGN: BOIZALLVULN</text>

  <!-- Main Name & Callsign -->
  <text x="48" y="114" class="sans" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="0.5">KHOI DUONG</text>
  <text x="368" y="114" class="mono" font-size="24" font-weight="700" fill="url(#cyanViolet)">// KOI.ORBITAL_DECK</text>

  <!-- Subtitle -->
  <text x="48" y="148" class="sans" font-size="18" font-weight="600" fill="#38bdf8">
    Cybersecurity Engineer · AI Safety Architect · DFIR Threat Hunter · Quant Systems Builder
  </text>

  <!-- Terminal Prompt Box -->
  <rect x="48" y="168" width="816" height="44" rx="8" fill="#050811" stroke="#1e293b" stroke-width="1.2" />
  <text x="64" y="195" class="mono" font-size="12" fill="#10b981" font-weight="700">koi@galactic:~$</text>
  <text x="184" y="195" class="mono" font-size="12" fill="#e2e8f0">
    verify --edu="M.S. CS @ SFBU (3.78 GPA)" --role="Founder &amp; President, BaySec"
  </text>
  <rect class="cursor" x="760" y="182" width="8" height="16" fill="#00f0ff" />

  <!-- Bottom 4 High-Impact Telemetry Badges -->
  <!-- Badge 1: TryHackMe -->
  <g transform="translate(48, 232)">
    <rect width="192" height="68" rx="10" fill="#07121e" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="14" y="22" class="mono" font-size="10" fill="#94a3b8">TRYHACKME GLOBAL</text>
    <text x="14" y="45" class="mono" font-size="20" font-weight="800" fill="#10b981">TOP 1% RANK</text>
    <text x="14" y="60" class="mono" font-size="9.5" fill="#64748b">DFIR · Malware · ELF RE</text>
  </g>

  <!-- Badge 2: Operation Cymbal -->
  <g transform="translate(252, 232)">
    <rect width="208" height="68" rx="10" fill="#07121e" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="14" y="22" class="mono" font-size="10" fill="#94a3b8">GOOGLE CLOUD SEC × HTB</text>
    <text x="14" y="45" class="mono" font-size="20" font-weight="800" fill="#00f0ff">18/18 (100%)</text>
    <text x="14" y="60" class="mono" font-size="9.5" fill="#64748b">Solo Clear · #458 / 1,716</text>
  </g>

  <!-- Badge 3: LeetCode -->
  <g transform="translate(472, 232)">
    <rect width="196" height="68" rx="10" fill="#07121e" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="14" y="22" class="mono" font-size="10" fill="#94a3b8">LEETCODE ALGORITHMS</text>
    <text x="14" y="45" class="mono" font-size="20" font-weight="800" fill="#f59e0b">1,377 SOLVED</text>
    <text x="14" y="60" class="mono" font-size="9.5" fill="#64748b">245 Hard · Rank #11,649</text>
  </g>

  <!-- Badge 4: Hackathons -->
  <g transform="translate(680, 232)">
    <rect width="192" height="68" rx="10" fill="#07121e" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="14" y="22" class="mono" font-size="10" fill="#94a3b8">HACKATHON TROPHIES</text>
    <text x="14" y="45" class="mono" font-size="20" font-weight="800" fill="#c084fc">2× CHAMPION</text>
    <text x="14" y="60" class="mono" font-size="9.5" fill="#64748b">ThinkNext '26 &amp; BayHack '25</text>
  </g>
</svg>
